<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16875a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="배송달력">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>배송 달력 · 해남공구마켓</title>
<style>
  *{box-sizing:border-box}
  :root{--red:#e5484d;--yellow:#f2a20c;--green:#2f9e5b;--gray:#a3abb3;--blue:#2878d0;--line:#e3e7e4;--bg:#f4f6f4}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:#1f2421;-webkit-text-size-adjust:100%}
  button{font:inherit;border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer;background:#ecefec;color:#222}
  button.primary{background:#16875a;color:#fff}
  input,select{font:inherit;border:1px solid #ccd3cc;border-radius:10px;padding:10px;background:#fff}
  .top{position:sticky;top:0;z-index:30;background:#16875a;color:#fff;padding:10px 14px calc(10px);display:flex;align-items:center;gap:8px}
  .top h1{margin:0;font-size:18px;flex:1;white-space:nowrap}
  .top button{background:rgba(255,255,255,.18);color:#fff;padding:7px 11px;font-size:14px}
  .top a{color:#fff;font-size:13px;text-decoration:none;opacity:.9}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 12px 80px}
  .login{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .login h2{margin:0 0 6px;font-size:20px}
  .login input[type=password]{width:100%;margin:12px 0 8px}
  .login label{display:flex;align-items:center;gap:6px;font-size:14px;color:#444;margin-bottom:12px}
  .login button{width:100%;padding:12px}
  .msg{padding:10px 12px;border-radius:10px;background:#eef8f2;color:#17623f;margin:10px 0;font-size:14px;display:none}
  .msg.err{background:#fdeaea;color:#a32121}
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .chip{background:#fff;border:2px solid transparent;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .chip b{display:block;font-size:24px;line-height:1.1}
  .chip span{font-size:12px;color:#555;font-weight:700}
  .chip.on{border-color:#1f2421}
  .chip.red b{color:var(--red)} .chip.yellow b{color:var(--yellow)} .chip.green b{color:var(--green)} .chip.gray b{color:#6b747c}
  .layout{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:900px){.layout{grid-template-columns:430px 1fr;align-items:start}.calcol{position:sticky;top:62px}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .calnav button{padding:6px 12px;background:#f1f4f2}
  .month h3{margin:6px 0 8px;font-size:17px}
  .month+.month{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
  .dow{font-size:13px;font-weight:700;padding:6px 0}
  .sun{color:#e5484d} .sat{color:#2878d0} .hol{color:#e5484d}
  .hname{font-size:9.5px;line-height:1.1;color:#e5484d;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .day{position:relative;min-height:54px;padding:6px 2px 4px;border-radius:10px;cursor:pointer;font-size:15px;user-select:none}
  @media(hover:hover){.day:hover{background:#f3f6f4}}
  .day.empty{cursor:default;background:none}
  .day.today .num{font-weight:800;text-decoration:underline;text-underline-offset:3px}
  .day.sel{background:#e3eaf6}
  .day.past .num{opacity:.55}
  .dots{display:flex;justify-content:center;gap:3px;margin-top:3px;min-height:8px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.red{background:var(--red)} .dot.yellow{background:var(--yellow)} .dot.green{background:var(--green)} .dot.gray{background:var(--gray)}
  .cnt{font-size:11px;color:#555;margin-top:1px;font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#555;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
  .legend span{display:flex;align-items:center;gap:4px}
  .opt{display:flex;align-items:center;gap:6px;font-size:13px;color:#555;margin-top:8px;flex-wrap:wrap}
  .opt select{padding:6px 8px;font-size:13px}
  .dhead h2{margin:0;font-size:19px}
  .dhead p{margin:4px 0 0;color:#555;font-size:14px}
  .sup{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .suph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#f6f9f7;border-bottom:1px solid var(--line)}
  .suph b{font-size:16px;flex:1;min-width:140px}
  .suph button{padding:7px 10px;font-size:13px}
  .suph .kakao{background:#fee500;color:#191600}
  .prods{padding:6px 12px 0;font-size:13px;color:#444}
  .ord{display:flex;gap:10px;padding:10px 12px;border-top:1px solid #f0f2f1}
  .ord:first-of-type{border-top:0}
  .ord .dot{margin-top:6px;width:12px;height:12px}
  .ord .body{flex:1;min-width:0}
  .ord .l1{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .ord .l1 b{font-size:15px}
  .ord .qty{font-weight:800}
  .ord .l2,.ord .l3{font-size:13px;color:#555;margin-top:3px;word-break:break-all}
  .ord a{color:var(--blue);text-decoration:none}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:#eef0ef;color:#444}
  .tag.red{background:#fde8e8;color:#b42318} .tag.yellow{background:#fff3d6;color:#8a5a00} .tag.green{background:#e3f4ea;color:#17623f} .tag.gray{background:#eef0f2;color:#555}
  .tag.unpaid{background:#fde8e8;color:#b42318}
  .datehead{margin:18px 0 0;font-size:15px;font-weight:800;padding-bottom:6px;border-bottom:2px solid #1f2421}
  .empty-box{color:#666;text-align:center;padding:30px 10px;font-size:14px}
  .note{font-size:12px;color:#68736b;line-height:1.5;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2421;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="top">
  <h1>📅 배송 달력</h1>
  <span id="lastLoad" style="font-size:12px;opacity:.85"></span>
  <button id="reloadBtn" type="button" onclick="forceReload()" style="display:none">새로고침</button>
  <a href="admin.html">관리자</a>
</div>

<div class="wrap">
  <div id="loginBox" class="login">
    <h2>관리자 확인</h2>
    <div style="font-size:14px;color:#555;line-height:1.5">희망 도착일이 있는 주문을 달력으로 보여 줍니다.</div>
    <input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <label><input id="remember" type="checkbox" style="width:auto"> 이 기기에서 비밀번호 기억 (본인 휴대폰만)</label>
    <button class="primary" type="button" onclick="login()">달력 열기</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="app" style="display:none">
    <div id="msg" class="msg"></div>
    <div class="sum">
      <div class="chip red" onclick="showColor('red')"><b id="cRed">0</b><span>🔴 급함</span></div>
      <div class="chip yellow" onclick="showColor('yellow')"><b id="cYellow">0</b><span>🟡 곧 출고</span></div>
      <div class="chip gray" onclick="showColor('gray')"><b id="cGray">0</b><span>⚪ 예정</span></div>
      <div class="chip green" onclick="showColor('green')"><b id="cGreen">0</b><span>🟢 발송됨</span></div>
    </div>
    <div class="layout">
      <div class="calcol">
        <div class="card">
          <div class="calnav">
            <button type="button" onclick="moveMonth(-1)">◀ 이전</button>
            <button type="button" onclick="goToday()">오늘</button>
            <button type="button" onclick="moveMonth(1)">다음 ▶</button>
          </div>
          <div id="months"></div>
          <div class="legend">
            <span><i class="dot red"></i>오늘 출고·출고일 지남</span>
            <span><i class="dot yellow"></i>1~2일 안에 출고</span>
            <span><i class="dot gray"></i>예정</span>
            <span><i class="dot green"></i>송장 등록됨</span>
          </div>
          <div class="opt">출고일 기준:
            <select id="leadSel" onchange="setLead(this.value)">
              <option value="1">도착 1일 전 출고</option>
              <option value="2">도착 2일 전 출고</option>
            </select>
            <span>(일요일이면 토요일로 당김)</span>
          </div>
        </div>
      </div>
      <div class="card" id="detail"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbz9-pk6kkPk01Lh11agNKxeV1Gjo_kzAPYOXyJ9kXUVY7r8t3ptrLurCjOwdTf31f00ug/exec';
const PW_KEY='hnCalPw', LEAD_KEY='hnCalLead';
const DOW=['일','월','화','수','목','금','토'];
const COLOR_LABEL={red:'🔴 급함',yellow:'🟡 곧 출고',gray:'⚪ 예정',green:'🟢 발송됨'};
const COLOR_RANK={red:4,yellow:3,gray:2,green:1};
const NO_SUPPLIER='공급처 미지정';
const IS_MOBILE=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);

let lastLoadAt=0, password='', orders=[], undated=[], supplierOf={}, viewStart=null, selected=null, colorView='', lead=1, timer=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const md=d=>(d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const todayDate=()=>{const t=new Date();t.setHours(0,0,0,0);return t;};
const dayDiff=(a,b)=>Math.round((a-b)/86400000);
const keyOf=s=>String(s||'').replace(/\s+/g,'').toLowerCase();

function parseDate(v){
  if(!v) return null;
  if(v instanceof Date) return isNaN(v)?null:new Date(v.getFullYear(),v.getMonth(),v.getDate());
  const s=String(v).trim();
  if(/\d{4}-\d{2}-\d{2}T/.test(s)){ const d=new Date(s); if(!isNaN(d)) return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  const m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
function phoneFmt(p){
  let s=String(p||'').replace(/\D/g,''); if(s.length===10&&s.startsWith('10')) s='0'+s;
  if(s.length===11) return s.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if(s.length===10) return s.replace(/(\d{2,3})(\d{3,4})(\d{4})/,'$1-$2-$3');
  return s;
}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600);}
function showMsg(t,err){const el=$('msg');el.textContent=t;el.className='msg'+(err?' err':'');el.style.display=t?'block':'none';}

async function apiGet(params){
  const u=new URL(API_URL); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v??''));
  const r=await fetch(u); return r.json();
}

/* ---------- 로그인 ---------- */
function login(){
  const v=$('pw').value.trim();
  if(!v){ const m=$('loginMsg'); m.textContent='비밀번호를 입력해 주세요.'; m.className='msg err'; m.style.display='block'; return; }
  password=v;
  try{ if($('remember').checked) localStorage.setItem(PW_KEY,v); else localStorage.removeItem(PW_KEY); sessionStorage.setItem(PW_KEY,v); }catch(_){}
  loadAll(true);
}
function logout(msg){
  password=''; try{[localStorage,sessionStorage].forEach(st=>{st.removeItem(PW_KEY);st.removeItem(CACHE_KEY);});}catch(_){}
  $('app').style.display='none'; $('reloadBtn').style.display='none'; $('loginBox').style.display='block';
  const m=$('loginMsg'); m.textContent=msg||''; m.className='msg err'; m.style.display=msg?'block':'none';
}

/* ---------- 데이터 ---------- */
// 상품코드 → 공급처: 매입관리 '공급단가' 이력 중 오늘 적용되는 공급처 지정 단가 (없으면 가장 최근 공급처 지정 단가)
function buildSupplierMap(prices){
  const today=ymd(todayDate()), map={}, byCode={};
  (prices||[]).filter(x=>x&&x.productCode&&String(x.supplierName||'').trim()).forEach(x=>{(byCode[x.productCode]=byCode[x.productCode]||[]).push(x);});
  Object.entries(byCode).forEach(([code,list])=>{
    const s=d=>String(d||'').slice(0,10);
    const active=list.filter(x=>s(x.startDate)<=today&&(!s(x.endDate)||s(x.endDate)>=today));
    const pick=(active.length?active:list).slice().sort((a,b)=>s(b.startDate).localeCompare(s(a.startDate)));
    const names=[...new Set((active.length?active:pick.slice(0,1)).map(x=>String(x.supplierName).trim()))];
    map[code]=names.join(', ');
  });
  return map;
}
function normalizeRow(r,memoMap){
  const no=String(r.orderNumber||r.orderNo||'').trim();
  const extra=memoMap[no]||{};
  const tracking=String(r.trackingNumber||'').trim();
  let st=String(r.shippingStatus||'').trim();
  if(!st) st=tracking?'송장등록':'배송대기';
  // 주문관리 '배송완료' 체크(K열)도 발송 완료로 봅니다 — 배송관리에 송장을 안 넣고 체크만 한 주문
  const doneFlag=v=>v===true||String(v).toUpperCase()==='TRUE';
  if(st!=='배송완료'&&(doneFlag(r.shippingCompleted)||doneFlag(extra.shippingCompleted))) st='배송완료';
  return {
    orderNumber:no,
    productCode:String(r.productCode||extra.productCode||'').trim(),
    productName:String(r.productName||extra.productName||'').trim(),
    name:String(r.name||extra.name||'').trim(),
    phone:r.phone||extra.phone||'',
    qty:Number(r.qty||r.quantity||extra.qty||extra.quantity||0),
    address:String(r.address||extra.address||'').trim(),
    memo:String(r.memo!=null&&r.memo!==''?r.memo:(extra.memo||'')).trim(),
    deliveryRaw:r.deliveryDate||extra.deliveryDate||'',
    paid:!!(r.paymentConfirmed!=null?r.paymentConfirmed:extra.paymentConfirmed),
    courier:String(r.courier||'').trim(),
    tracking, status:st,
    createdAt:String(extra.createdAt||extra.date||r.createdAt||'')
  };
}
/* 2026-11-18 한국 공휴일 (인사혁신처 고시·우주항공청 월력요항 기준, 노동절·제헌절 포함). 새해가 되면 다음 해를 추가하세요. */
const KR_HOLIDAYS={
 '2026-01-01':'신정','2026-02-16':'설 연휴','2026-02-17':'설날','2026-02-18':'설 연휴','2026-03-01':'삼일절','2026-03-02':'대체공휴일',
 '2026-05-01':'노동절','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일',
 '2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴',
 '2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절',
 '2027-01-01':'신정','2027-02-06':'설 연휴','2027-02-07':'설날','2027-02-08':'설 연휴','2027-02-09':'대체공휴일','2027-03-01':'삼일절',
 '2027-05-01':'노동절','2027-05-03':'대체공휴일','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일',
 '2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴',
 '2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일'
};
const holidayOf=d=>KR_HOLIDAYS[ymd(d)]||'';
function shipDateOf(arr){
  let d=addDays(arr,-lead);
  // 일요일·공휴일이면 하루씩 앞당김 (토요일 출고는 그대로)
  for(let i=0;i<10&&(d.getDay()===0||holidayOf(d));i++) d=addDays(d,-1);
  return d;
}
function colorOf(o){
  if(o.tracking||['송장등록','배송중','배송완료'].includes(o.status)) return 'green';
  if(!o.arrival) return 'gray';
  const left=dayDiff(o.ship,todayDate());
  if(left<=0) return 'red';
  if(left<=2) return 'yellow';
  return 'gray';
}
function reason(o){
  if(o.color==='green') return o.status==='배송완료'?(o.tracking?'배송완료':'배송완료 (송장 없음)'):(o.tracking?'송장 등록':o.status);
  if(!o.ship) return '희망일 없음';
  const left=dayDiff(o.ship,todayDate());
  if(left<0) return '출고일 '+(-left)+'일 지남';
  if(left===0) return '오늘 출고';
  if(left===1) return '내일 출고';
  return left+'일 뒤 출고';
}

// 빠른 표시: ① 저장해 둔 지난 데이터를 바로 보여 주고 ② 배송목록이 오면 먼저 그리고 ③ 요청사항·공급처는 오는 대로 덧붙입니다.
const CACHE_KEY='hnCalCache', SUP_KEY='hnCalSupplier', SUP_TTL=6*60*60*1000;
let raw={ship:null,ord:null,naver:null}, loading=false;
function store(){ try{ return localStorage.getItem(PW_KEY)?localStorage:sessionStorage; }catch(_){ return null; } }
function saveCache(){
  try{ const s=store(); if(!s) return; s.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),ship:raw.ship,ord:raw.ord,naver:raw.naver})); }catch(_){}
}
function loadCache(){
  try{ for(const s of [sessionStorage,localStorage]){ const v=s.getItem(CACHE_KEY); if(v) return JSON.parse(v); } }catch(_){}
  return null;
}
function loadSupplierCache(){
  try{ const v=JSON.parse(localStorage.getItem(SUP_KEY)||'null'); if(v&&v.map) return v; }catch(_){}
  return null;
}
function rebuild(){
  const memoMap={};
  (raw.ord||[]).forEach(o=>{ const no=String(o.orderNo||o.orderNumber||'').trim(); if(no) memoMap[no]=o; });
  const base=raw.ship||Object.values(memoMap);
  const all=base.map(r=>normalizeRow(r,memoMap)).filter(o=>o.orderNumber&&o.status!=='취소'); // 2026-11-19 취소 주문은 달력에서 뺌
  // 네이버(스마트스토어) 주문 — 관리자 「🟢 네이버 주문」에서 붙여넣은 것
  (raw.naver||[]).filter(n=>n&&n.productOrderNo&&n.shippingStatus!=='취소').forEach(n=>{
    all.push({orderNumber:'N'+n.productOrderNo, productCode:String(n.productCode||'').trim(), productName:String(n.productName||'').trim(),
      name:String(n.name||'').trim(), phone:n.phone||'', qty:Number(n.qty||1), address:String(n.address||'').trim(), memo:String(n.memo||'').trim(),
      deliveryRaw:n.arrivalDate||'', paid:true, courier:String(n.courier||'').trim(), tracking:String(n.trackingNumber||'').trim(),
      status:n.shippingStatus||'배송대기', createdAt:n.paidAt||'', naver:true, shipDeadline:n.shipDeadline||''});
  });
  all.forEach(o=>{
    o.arrival=parseDate(o.deliveryRaw);
    o.ship=o.arrival?shipDateOf(o.arrival):null;
    o.supplier=supplierOf[o.productCode]||NO_SUPPLIER;
    o.color=colorOf(o);
  });
  orders=all.filter(o=>o.arrival);
  undated=all.filter(o=>!o.arrival&&o.color!=='green');
}
function showApp(){
  $('loginBox').style.display='none'; $('app').style.display='block'; $('reloadBtn').style.display='inline-block';
  if(!viewStart){ const t=todayDate(); viewStart=new Date(t.getFullYear(),t.getMonth(),1); }
  if(!selected&&!colorView){ if(orders.some(o=>o.color==='red')) colorView='red'; else selected=ymd(todayDate()); }
  renderAll();
}
function stamp(at,suffix){ const d=new Date(at); $('lastLoad').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+' 기준'+(suffix||''); }

async function loadAll(first){
  if(!password||loading) return;
  loading=true;
  const btn=$('reloadBtn'); btn.disabled=true; btn.textContent='불러오는 중...';
  const sup=loadSupplierCache(); if(sup) supplierOf=sup.map;
  // ① 지난 데이터 바로 표시
  if(first){
    const c=loadCache();
    if(c&&(c.ship||c.ord)){ raw={ship:c.ship,ord:c.ord,naver:c.naver||null}; rebuild(); showApp(); stamp(c.at,' · 새로 불러오는 중'); }
    else { const m=$('loginMsg'); m.textContent='불러오는 중... (처음에는 몇 초 걸립니다)'; m.className='msg'; m.style.display='block'; }
  }
  const fail=e=>({success:false,message:e.message});
  const shipP=apiGet({action:'shippingList',password}).catch(fail);
  const ordP=apiGet({action:'orders',password}).catch(fail);
  const needSup=true; // 공급처는 저장본으로 먼저 보여 주고 매번 뒤에서 새로 받습니다 (등록 직후 바로 반영)
  const nvP=apiGet({action:'adminNaverOrderList',password}).catch(fail);
  const purP=needSup?apiGet({action:'adminPurchaseFormData',password}).catch(fail):null;
  const warn=[];
  try{
    // ② 배송목록 먼저
    const ship=await shipP;
    if(ship&&ship.success===false&&/비밀번호/.test(String(ship.message||''))) return logout('비밀번호가 맞지 않습니다.');
    if(ship.success){ raw.ship=ship.rows||[]; rebuild(); showApp(); stamp(Date.now(),' · 요청사항 불러오는 중'); }
    else warn.push('배송목록을 못 불러와 주문관리 기준으로 표시합니다.');
    // ③ 요청사항(주문관리)
    const ord=await ordP;
    if(ord.success){ raw.ord=ord.orders||ord.data||[]; }
    else if(!ship.success) throw new Error(ship.message||ord.message||'주문을 불러오지 못했습니다.');
    if(!ship.success) raw.ship=null;
    const nv=await nvP;
    if(nv&&nv.success) raw.naver=nv.orders||[];
    rebuild(); showApp(); saveCache();
    // ④ 공급처 (6시간마다 새로)
    if(purP){
      const pur=await purP;
      if(pur&&pur.success){ supplierOf=buildSupplierMap(pur.supplyPrices); try{ localStorage.setItem(SUP_KEY,JSON.stringify({at:Date.now(),map:supplierOf})); }catch(_){} rebuild(); renderAll(); }
      else if(!sup) warn.push('공급처 정보를 못 불러왔습니다 (업체가 "'+NO_SUPPLIER+'"로 보임).');
    }
    lastLoadAt=Date.now(); stamp(lastLoadAt);
    showMsg(warn.join(' '),warn.length>0);
    clearInterval(timer); timer=setInterval(()=>{ if(document.visibilityState==='visible') loadAll(); },5*60*1000);
  }catch(e){
    if($('app').style.display==='none'){ const m=$('loginMsg'); m.textContent='오류: '+e.message; m.className='msg err'; m.style.display='block'; }
    else showMsg('불러오기 오류: '+e.message+' (화면은 지난 데이터입니다)',true);
  }finally{ loading=false; btn.disabled=false; btn.textContent='새로고침'; }
}

function forceReload(){ try{localStorage.removeItem(SUP_KEY);}catch(_){} loadAll(); }
/* ---------- 화면 ---------- */
function renderAll(){ renderSummary(); renderMonths(); renderDetail(); }
function renderSummary(){
  const c=k=>orders.filter(o=>o.color===k).length;
  $('cRed').textContent=c('red'); $('cYellow').textContent=c('yellow'); $('cGray').textContent=c('gray'); $('cGreen').textContent=c('green');
  document.querySelectorAll('.chip').forEach(el=>el.classList.toggle('on',!!colorView&&el.classList.contains(colorView)));
}
function byDate(){
  const m={};
  orders.forEach(o=>{ const k=ymd(o.arrival); (m[k]=m[k]||[]).push(o); });
  return m;
}
function renderMonths(){
  const map=byDate(), today=ymd(todayDate());
  let html='';
  for(let i=0;i<2;i++){
    const first=new Date(viewStart.getFullYear(),viewStart.getMonth()+i,1);
    const last=new Date(first.getFullYear(),first.getMonth()+1,0);
    html+=`<div class="month"><h3>${first.getFullYear()}년 ${first.getMonth()+1}월</h3><div class="grid7">`;
    DOW.forEach((d,j)=>html+=`<div class="dow ${j===0?'sun':j===6?'sat':''}">${d}</div>`);
    for(let k=0;k<first.getDay();k++) html+='<div class="day empty"></div>';
    for(let d=1;d<=last.getDate();d++){
      const dt=new Date(first.getFullYear(),first.getMonth(),d), key=ymd(dt), list=map[key]||[];
      const colors=['red','yellow','gray','green'].filter(c=>list.some(o=>o.color===c));
      const boxes=list.reduce((a,o)=>a+o.qty,0);
      const hol=KR_HOLIDAYS[key]||'';
      const cls=['day',dt.getDay()===0||hol?'sun':dt.getDay()===6?'sat':'',key===today?'today':'',key===selected&&!colorView?'sel':'',key<today?'past':''].join(' ');
      html+=`<div class="${cls}" onclick="pickDate('${key}')"><div class="num">${d}</div>${hol?`<div class="hname" title="${hol}">${hol}</div>`:''}<div class="dots">${colors.map(c=>`<i class="dot ${c}"></i>`).join('')}</div>${list.length?`<div class="cnt">${boxes||list.length}${boxes?'박스':'건'}</div>`:''}</div>`;
    }
    html+='</div></div>';
  }
  $('months').innerHTML=html;
}
function groupBySupplier(list){
  const g={};
  list.forEach(o=>{(g[o.supplier]=g[o.supplier]||[]).push(o);});
  return Object.entries(g).sort((a,b)=>(a[0]===NO_SUPPLIER)-(b[0]===NO_SUPPLIER)||a[0].localeCompare(b[0],'ko'));
}
function sortOrders(list){
  return list.slice().sort((a,b)=>COLOR_RANK[b.color]-COLOR_RANK[a.color]||a.productName.localeCompare(b.productName,'ko')||a.name.localeCompare(b.name,'ko'));
}
function orderHtml(o){
  return `<div class="ord"><i class="dot ${o.color}"></i><div class="body">
    <div class="l1"><b>${esc(o.name||'(이름 없음)')}</b><span>${esc(o.productName)}</span><span class="qty">${o.qty}박스</span>${o.naver?'<span class="tag" style="background:#03c75a;color:#fff">N 스마트스토어</span>':''}
      <span class="tag ${o.color}">${esc(reason(o))}</span>${o.paid?'':'<span class="tag unpaid">입금 전</span>'}</div>
    <div class="l2">${o.phone?`<a href="tel:${esc(String(o.phone).replace(/\D/g,''))}">${esc(phoneFmt(o.phone))}</a> · `:''}${esc(o.address)}</div>
    ${o.memo?`<div class="l3">📝 ${esc(o.memo)}</div>`:''}
    ${o.naver&&o.shipDeadline&&o.color!=='green'?`<div class="l3" style="color:#b42318">네이버 발송기한 ${esc(String(o.shipDeadline).slice(0,16))} — 도착일보다 이르면 스마트스토어에서 「발송지연 처리」</div>`:''}
    <div class="l3" style="color:#8a938d">${esc(o.orderNumber)}${o.courier||o.tracking?' · '+esc(o.courier)+' '+esc(o.tracking):''}</div>
  </div></div>`;
}
function supplierBlock(sup,list,dateKey){
  const boxes=list.reduce((a,o)=>a+o.qty,0);
  const prod={}; list.forEach(o=>{prod[o.productName]=(prod[o.productName]||0)+o.qty;});
  const id='s'+Math.random().toString(36).slice(2,8);
  window._sendData=window._sendData||{}; window._sendData[id]={sup,list,dateKey};
  return `<div class="sup"><div class="suph"><b>🏭 ${esc(sup)} <span style="font-weight:400;font-size:13px;color:#555">· ${list.length}건 ${boxes}박스</span></b>
    <button type="button" onclick="copyFor('${id}')">📋 복사</button>
    <button type="button" class="kakao" onclick="shareFor('${id}')">${IS_MOBILE?'카톡 보내기':'카톡용 복사'}</button></div>
    <div class="prods">${Object.entries(prod).map(([n,q])=>`${esc(n)} <b>${q}박스</b>`).join(' · ')}${sup===NO_SUPPLIER?'<div class="note" style="margin-top:4px">⚠️ 관리자 ⑦ 매입관리 &gt; 공급단가에서 이 상품의 공급처를 지정하면 업체 이름으로 묶입니다.</div>':''}</div>
    ${sortOrders(list).map(orderHtml).join('')}</div>`;
}
function renderDetail(){
  const box=$('detail');
  if(colorView){
    const list=orders.filter(o=>o.color===colorView);
    if(colorView==='green') list.sort((a,b)=>b.arrival-a.arrival); else list.sort((a,b)=>a.arrival-b.arrival);
    const shown=colorView==='green'?list.slice(0,60):list;
    let html=`<div class="dhead"><h2>${COLOR_LABEL[colorView]} 주문 ${list.length}건</h2><p>${colorView==='red'?'오늘 출고해야 하거나 출고일이 지났는데 송장이 없는 주문입니다.':colorView==='yellow'?'1~2일 안에 출고해야 하는 주문입니다. 업체에 미리 전달하세요.':colorView==='gray'?'3일 이상 남은 주문입니다.':'송장이 등록된 주문입니다 (최근 도착일 순 60건까지).'}</p>
      <div style="margin-top:8px"><button type="button" onclick="colorView='';selected=selected||ymd(todayDate());renderAll()">날짜별로 보기</button></div></div>`;
    if(!shown.length) html+='<div class="empty-box">해당하는 주문이 없습니다 👍</div>';
    const dates={}; shown.forEach(o=>{const k=ymd(o.arrival);(dates[k]=dates[k]||[]).push(o);});
    Object.keys(dates).forEach(k=>{
      const d=parseDate(k);
      html+=`<div class="datehead" onclick="pickDate('${k}')" style="cursor:pointer">${md(d)} 도착 · ${md(shipDateOf(d))} 출고 ›</div>`;
      groupBySupplier(dates[k]).forEach(([s,l])=>html+=supplierBlock(s,l,k));
    });
    if(colorView!=='green') html+=undatedHtml();
    box.innerHTML=html; return;
  }
  const d=parseDate(selected), list=orders.filter(o=>ymd(o.arrival)===selected);
  const boxes=list.reduce((a,o)=>a+o.qty,0);
  let html=`<div class="dhead"><h2>${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]}) 도착${holidayOf(d)?` <span class="hol" style="font-size:14px">· ${holidayOf(d)}</span>`:''}</h2><p>출고일 <b>${md(shipDateOf(d))}</b>${holidayOf(addDays(d,-lead))?` <span class="hol">(${holidayOf(addDays(d,-lead))}이라 앞당김)</span>`:''} · ${list.length}건 ${boxes}박스${list.some(o=>!o.paid)?` · 입금 전 ${list.filter(o=>!o.paid).length}건`:''}</p>${holidayOf(d)||d.getDay()===0?'<p class="hol" style="font-weight:700">⚠️ 공휴일·일요일 도착 — 택배 휴무일 수 있어 손님께 날짜 확인이 필요합니다.</p>':''}</div>`;
  if(!list.length) html+='<div class="empty-box">이날 도착 희망 주문이 없습니다.</div>';
  groupBySupplier(list).forEach(([s,l])=>html+=supplierBlock(s,l,selected));
  html+=undatedHtml();
  box.innerHTML=html;
}
function undatedHtml(){
  if(!undated.length) return '';
  return `<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:800;font-size:14px">희망 도착일 없는 미발송 주문 ${undated.length}건</summary>
    <div class="note">희망일 선택이 없는 상품의 주문입니다. 달력에는 안 나오니 따로 확인하세요.</div>
    ${groupBySupplier(undated).map(([s,l])=>`<div class="sup"><div class="suph"><b>🏭 ${esc(s)} <span style="font-weight:400;font-size:13px;color:#555">· ${l.length}건</span></b></div>${l.map(orderHtml).join('')}</div>`).join('')}</details>`;
}
function pickDate(k){ selected=k; colorView=''; renderAll(); if(window.innerWidth<900) $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
function showColor(c){ colorView=colorView===c?'':c; if(!colorView&&!selected) selected=ymd(todayDate()); renderAll(); if(window.innerWidth<900) $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
function moveMonth(n){ viewStart=new Date(viewStart.getFullYear(),viewStart.getMonth()+n,1); renderMonths(); }
function goToday(){ const t=todayDate(); viewStart=new Date(t.getFullYear(),t.getMonth(),1); pickDate(ymd(t)); }
function setLead(v){
  lead=Number(v)||1; try{localStorage.setItem(LEAD_KEY,String(lead));}catch(_){}
  orders.forEach(o=>{o.ship=shipDateOf(o.arrival);o.color=colorOf(o);}); renderAll();
}

/* ---------- 업체 전달 ---------- */
function sendText(id){
  const {sup,list,dateKey}=window._sendData[id];
  const paid=sortOrders(list).filter(o=>o.paid&&o.color!=='green');
  const skipUnpaid=list.filter(o=>!o.paid&&o.color!=='green').length;
  const done=list.filter(o=>o.color==='green').length;
  const d=parseDate(dateKey);
  const prod={}; paid.forEach(o=>{(prod[o.productName]=prod[o.productName]||[]).push(o);});
  let t=`[해남공구마켓] ${sup==='공급처 미지정'?'':sup+' '}출고 요청\n도착 희망: ${md(d)}\n출고일: ${md(shipDateOf(d))}\n`;
  if(!paid.length) t+='\n출고할 주문이 없습니다.';
  Object.entries(prod).forEach(([name,l])=>{
    t+=`\n■ ${name} — ${l.reduce((a,o)=>a+o.qty,0)}박스 (${l.length}건)\n`;
    l.forEach((o,i)=>{ t+=`${i+1}) ${o.name} / ${phoneFmt(o.phone)} / ${o.qty}박스\n   ${o.address}\n`+(o.memo?`   요청: ${o.memo}\n`:''); });
  });
  t+=`\n송장번호는 주문자 이름과 함께 보내 주세요. 감사합니다.`;
  return {t,skipUnpaid,done,count:paid.length};
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(_){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(__){} ta.remove(); return ok; }
}
function extraNote(r){ return (r.skipUnpaid?` · 입금 전 ${r.skipUnpaid}건 제외`:'')+(r.done?` · 발송된 ${r.done}건 제외`:''); }
async function copyFor(id){
  const r=sendText(id); const ok=await copyText(r.t);
  toast(ok?`${r.count}건 복사했습니다. 카톡방에 붙여넣으세요`+extraNote(r):'복사하지 못했습니다.');
}
async function shareFor(id){
  const r=sendText(id);
  const mobile=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
  if(mobile&&navigator.share){
    try{ await navigator.share({text:r.t}); if(r.skipUnpaid||r.done) toast('보냈습니다'+extraNote(r)); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  const ok=await copyText(r.t);
  showSendBox(r,ok);
}
function showSendBox(r,ok){
  let m=$('sendBox');
  if(!m){ m=document.createElement('div'); m.id='sendBox';
    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px';
    m.onclick=e=>{ if(e.target===m) m.style.display='none'; }; document.body.appendChild(m); }
  m.innerHTML=`<div style="background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px">
    <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">${ok?'✅ 복사됐습니다':'아래 글을 복사해 주세요'}</b><button type="button" onclick="document.getElementById('sendBox').style.display='none'">닫기 ✕</button></div>
    <ol style="margin:10px 0;padding-left:20px;line-height:1.7;font-size:15px">
      <li>PC 카카오톡에서 <b>업체 대화방</b>을 엽니다 (둘톡·단톡방 모두 가능)</li>
      <li>입력칸을 누르고 <b>Ctrl+V</b> → <b>전송</b></li></ol>
    <div style="font-size:13px;color:#555;margin-bottom:6px">${esc(r.count+'건'+extraNote(r))} · 휴대폰에서 누르면 카톡 대화방 고르는 창이 바로 열립니다.</div>
    <textarea readonly style="width:100%;min-height:260px;border:1px solid #ccd3cc;border-radius:10px;padding:10px;font-size:13px">${esc(r.t)}</textarea>
    <div style="margin-top:10px;text-align:right"><button type="button" class="primary" onclick="copyText(this.closest('div').previousElementSibling.value).then(ok=>toast(ok?'다시 복사했습니다':'복사 실패'))">다시 복사</button></div></div>`;
  m.style.display='flex';
}

/* ---------- 시작 ---------- */
(function init(){
  try{ lead=Number(localStorage.getItem(LEAD_KEY))||1; }catch(_){}
  $('leadSel').value=String(lead);
  let saved=''; try{ saved=sessionStorage.getItem(PW_KEY)||localStorage.getItem(PW_KEY)||''; }catch(_){}
  if(saved){ password=saved; $('pw').value=saved; try{ $('remember').checked=!!localStorage.getItem(PW_KEY); }catch(_){} loadAll(true); }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&password&&$('app').style.display!=='none'&&Date.now()-lastLoadAt>60000) loadAll(); });
})();
</script>
