<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>해남 농산물 공동구매</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f6f5f1;
  color: #222;
}

.wrap {
  max-width: 760px;
  margin: auto;
  padding: 18px;
}

.hero {
  background: #fff;
  border-radius: 22px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

.badge {
  display: inline-block;
  background: #198754;
  color: white;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: bold;
}

h1 {
  margin: 14px 0 8px;
  font-size: 32px;
}

.description {
  line-height: 1.7;
  color: #555;
}

.hero-image {
  width: 100%;
  max-height: 420px;
  object-fit: cover;
  border-radius: 18px;
  margin-top: 18px;
}

.price {
  font-size: 36px;
  font-weight: 800;
  margin: 20px 0 5px;
}

.card {
  background: white;
  margin-top: 18px;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}

.card h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 8px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  margin: 7px 0 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.privacy-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 5px 0 18px;
  font-size: 14px;
  font-weight: normal;
}

.privacy-row input {
  width: auto;
  margin: 3px 0 0;
}

.order-btn {
  width: 100%;
  background: #198754;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.order-btn:hover {
  background: #146c43;
}

.order-btn:disabled {
  background: #999;
  cursor: not-allowed;
}

#msg {
  margin-top: 15px;
  font-weight: bold;
  line-height: 1.6;
}

.success {
  color: #198754;
}

.error {
  color: #c62828;
}

.count-box {
  text-align: center;
  padding: 18px;
  background: #f4faf6;
  border-radius: 14px;
  margin-bottom: 15px;
}

.count {
  font-size: 38px;
  font-weight: 800;
  color: #198754;
}

.small {
  font-size: 13px;
  color: #777;
  line-height: 1.6;
}

.recent {
  padding: 12px 4px;
  border-bottom: 1px solid #eee;
}

.recent:last-child {
  border-bottom: 0;
}

.loading {
  color: #777;
}

.closed {
  background: #777;
}

@media (max-width: 600px) {
  h1 {
    font-size: 27px;
  }

  .price {
    font-size: 31px;
  }

  .wrap {
    padding: 10px;
  }

  .hero,
  .card {
    padding: 18px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- 상품 영역 -->
  <section class="hero">

    <span class="badge">산지 공동구매</span>

    <h1 id="title">
      해남 농산물 공동구매
    </h1>

    <div
      id="description"
      class="description"
    >
      해남에서 정성껏 준비했습니다.
    </div>

    <img
      id="productImage"
      class="hero-image"
      src="https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?auto=format&fit=crop&w=1200&q=80"
      alt="상품 이미지"
    >

    <div class="price">
      <span id="price">
        59,900
      </span>원
    </div>

  </section>


  <!-- 주문 -->
  <section class="card">

    <h2>예약 주문</h2>

    <form id="orderForm">

      <label for="name">
        성함
      </label>

      <input
        id="name"
        type="text"
        required
        autocomplete="name"
      >


      <label for="phone">
        연락처
      </label>

      <input
        id="phone"
        type="tel"
        required
        placeholder="010-0000-0000"
        autocomplete="tel"
      >


      <label for="qty">
        주문 수량
      </label>

      <select id="qty">

        <option value="1">
          1개
        </option>

        <option value="2">
          2개
        </option>

        <option value="3">
          3개
        </option>

        <option value="4">
          4개
        </option>

        <option value="5">
          5개
        </option>

        <option value="6">
          6개
        </option>

        <option value="7">
          7개
        </option>

        <option value="8">
          8개
        </option>

        <option value="9">
          9개
        </option>

        <option value="10">
          10개
        </option>

      </select>


      <label for="address">
        배송 주소
      </label>

      <input
        id="address"
        type="text"
        required
        autocomplete="street-address"
      >


      <label for="memo">
        요청사항
      </label>

      <textarea
        id="memo"
        placeholder="배송 시 요청사항 등이 있으면 적어주세요."
      ></textarea>


      <label class="privacy-row">

        <input
          type="checkbox"
          id="privacy"
          required
        >

        <span>
          주문 및 배송 처리를 위한
          개인정보 수집·이용에 동의합니다.
        </span>

      </label>


      <button
        id="orderButton"
        class="order-btn"
        type="submit"
      >
        공동구매 예약하기
      </button>

    </form>

    <div id="msg"></div>

  </section>


  <!-- 공동구매 현황 -->
  <section class="card">

    <h2>공동구매 현황</h2>

    <div class="count-box">

      <div>
        현재 예약
      </div>

      <div>
        <span
          class="count"
          id="orderCount"
        >
          0
        </span>
        건
      </div>

    </div>

    <p class="small">
      개인정보 보호를 위해
      최근 예약자의 이름은 일부만 표시됩니다.
      전화번호와 주소는 공개되지 않습니다.
    </p>

    <div id="recentOrders">

      <div class="loading">
        예약 현황을 불러오는 중입니다.
      </div>

    </div>

  </section>

</div>


<script>

/*************************************************
 * Google Apps Script 웹앱 주소
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbz9-pk6kkPk01Lh11agNKxeV1Gjo_kzAPYOXyJ9kXUVY7r8t3ptrLurCjOwdTf31f00ug/exec";


/*************************************************
 * HTML 요소
 *************************************************/

const titleElement =
  document.getElementById("title");

const descriptionElement =
  document.getElementById("description");

const priceElement =
  document.getElementById("price");

const productImage =
  document.getElementById("productImage");

const orderForm =
  document.getElementById("orderForm");

const orderButton =
  document.getElementById("orderButton");

const messageBox =
  document.getElementById("msg");

const orderCount =
  document.getElementById("orderCount");

const recentOrders =
  document.getElementById("recentOrders");


/*************************************************
 * 상품 설정 불러오기
 *************************************************/

async function loadSettings() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=settings&t=" +
        Date.now()
      );

    const data =
      await response.json();

    if (
      !data.success ||
      !data.settings
    ) {
      return;
    }

    const settings =
      data.settings;


    if (settings.title) {

      titleElement.textContent =
        settings.title;

    }


    if (settings.description) {

      descriptionElement.textContent =
        settings.description;

    }


    if (
      settings.price !== undefined &&
      settings.price !== ""
    ) {

      priceElement.textContent =
        Number(
          settings.price
        ).toLocaleString();

    }


    if (settings.image) {

      productImage.src =
        settings.image;

    }


    /*
     * 설정 시트의 판매상태를
     * 판매중 / 판매종료 등으로 관리
     */

    if (
      settings.saleStatus &&
      settings.saleStatus !== "판매중"
    ) {

      orderButton.disabled =
        true;

      orderButton.classList.add(
        "closed"
      );

      orderButton.textContent =
        "현재 주문이 마감되었습니다.";

    }

  } catch (error) {

    console.error(
      "상품 설정 오류:",
      error
    );

  }

}


/*************************************************
 * 공개 주문 현황
 *************************************************/

async function loadPublicOrders() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=publicOrders&t=" +
        Date.now()
      );

    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "예약현황 조회 실패"
      );

    }


    orderCount.textContent =
      data.count || 0;


    const orders =
      data.orders || [];


    if (orders.length === 0) {

      recentOrders.innerHTML =
        '<div class="recent">' +
        '아직 첫 예약을 기다리고 있습니다.' +
        '</div>';

      return;

    }


    recentOrders.innerHTML =
      orders.map(function(order) {

        return (
          '<div class="recent">' +
          '<strong>' +
          escapeHtml(order.name) +
          '님</strong>' +
          ' · ' +
          Number(order.qty || 1) +
          '개 예약 접수' +
          '</div>'
        );

      }).join("");


  } catch (error) {

    console.error(
      "예약현황 오류:",
      error
    );

    recentOrders.innerHTML =
      '<div class="small">' +
      '예약 현황을 불러오지 못했습니다.' +
      '</div>';

  }

}


/*************************************************
 * 주문 접수
 *************************************************/

orderForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    if (
      !document
        .getElementById("privacy")
        .checked
    ) {

      alert(
        "개인정보 수집·이용에 동의해주세요."
      );

      return;

    }


    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const qty =
      Number(
        document
          .getElementById("qty")
          .value
      );

    const address =
      document
        .getElementById("address")
        .value
        .trim();

    const memo =
      document
        .getElementById("memo")
        .value
        .trim();


    if (
      !name ||
      !phone ||
      !address
    ) {

      alert(
        "성함, 연락처, 배송 주소를 입력해주세요."
      );

      return;

    }


    const originalText =
      orderButton.textContent;


    orderButton.disabled =
      true;

    orderButton.textContent =
      "예약 접수 중...";


    messageBox.textContent =
      "";

    messageBox.className =
      "";


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
              action: "addOrder",
              name: name,
              phone: phone,
              qty: qty,
              address: address,
              memo: memo
            })
          }
        );


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          data.message ||
          "주문 접수 실패"
        );

      }


      messageBox.className =
        "success";


      messageBox.innerHTML =
        "예약이 정상적으로 접수되었습니다.<br>" +
        "주문번호: <strong>" +
        escapeHtml(
          data.orderNumber
        ) +
        "</strong><br>" +
        "담당자가 확인 후 연락드리겠습니다.";


      orderForm.reset();


      if (
        data.count !== undefined
      ) {

        orderCount.textContent =
          data.count;

      }


      await loadPublicOrders();


    } catch (error) {

      console.error(
        "주문 오류:",
        error
      );


      messageBox.className =
        "error";


      messageBox.textContent =
        "예약 접수 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";

    } finally {

      /*
       * 판매중일 경우에만
       * 버튼 다시 활성화
       */

      if (
        orderButton.textContent !==
        "현재 주문이 마감되었습니다."
      ) {

        orderButton.disabled =
          false;

        orderButton.textContent =
          originalText;

      }

    }

  }
);


/*************************************************
 * HTML 문자 안전 처리
 *************************************************/

function escapeHtml(value) {

  return String(
    value === undefined ||
    value === null
      ? ""
      : value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/*************************************************
 * 페이지 시작
 *************************************************/

loadSettings();

loadPublicOrders();


/*
 * 30초마다 예약 건수 새로고침
 */

setInterval(
  loadPublicOrders,
  30000
);

</script>

</body>
</html>
