<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>공동구매 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0 25px;
    }

    h2 {
      font-size: 23px;
      margin: 0 0 22px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    input,
    textarea,
    select {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid #1f8b5c;
      border-color: transparent;
    }

    #title {
      width: 280px;
    }

    #price {
      width: 180px;
    }

    #imageUrl {
      width: 100%;
      margin-bottom: 12px;
    }

    #desc {
      width: 100%;
      min-height: 160px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #16875a;
      color: #fff;
    }

    .secondary {
      background: #ededed;
      color: #222;
    }

    .danger {
      background: #d9534f;
      color: #fff;
    }

    /* 이미지 업로드 */

    .upload-title {
      font-size: 17px;
      font-weight: 700;
      margin: 22px 0 10px;
    }

    .drop-zone {
      width: 100%;
      min-height: 190px;
      border: 2px dashed #aaa;
      border-radius: 14px;
      background: #fafafa;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 25px;
      cursor: pointer;

      transition: 0.2s;
    }

    .drop-zone:hover {
      border-color: #16875a;
      background: #f2faf6;
    }

    .drop-zone.dragover {
      border-color: #16875a;
      background: #e9f7ef;
      transform: scale(1.005);
    }

    .drop-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .drop-main {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .drop-sub {
      color: #777;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    .preview-box {
      display: none;
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .preview-box img {
      display: block;
      max-width: 420px;
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin: 0 auto 12px;
      border-radius: 10px;
      background: #fff;
    }

    .file-info {
      text-align: center;
      color: #555;
      margin-bottom: 12px;
    }

    .upload-actions {
      text-align: center;
    }

    .upload-status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .upload-status.loading {
      display: block;
      background: #fff4cf;
      color: #725800;
    }

    .upload-status.success {
      display: block;
      background: #e4f6ea;
      color: #126336;
    }

    .upload-status.error {
      display: block;
      background: #fde7e7;
      color: #a32121;
    }

    /* 주문관리 */

    .order-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .order-count {
      font-size: 17px;
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 9px;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: #f2f2f2;
      font-weight: 700;
    }

    td.address,
    td.memo {
      text-align: left;
      min-width: 180px;
    }

    .status-btn {
      padding: 7px 9px;
      font-size: 12px;
      margin: 2px;
    }

    .off {
      background: #eee;
      color: #555;
    }

    .on {
      background: #16875a;
      color: #fff;
    }

    .copy-btn {
      background: #2878d0;
      color: #fff;
      padding: 7px 10px;
      font-size: 12px;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: #777;
    }

    .save-message {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #e4f6ea;
      color: #126336;
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 16px 10px 40px;
      }

      .card {
        padding: 17px;
      }

      h1 {
        font-size: 27px;
      }

      #title,
      #price {
        width: 100%;
      }
    }

    /* 상세페이지 블록 편집기 */
    .detail-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .detail-builder{border:1px solid #ddd;border-radius:14px;background:#fafafa;padding:14px;min-height:100px}
    .detail-empty{text-align:center;color:#777;padding:28px 10px}
    .detail-block{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}
    .detail-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
    .detail-actions{display:flex;gap:5px;flex-wrap:wrap}
    .detail-actions button{padding:7px 10px;font-size:12px}
    .detail-block textarea,.detail-block input[type="text"]{width:100%}
    .detail-block textarea{min-height:110px;resize:vertical}
    .detail-drop{width:100%;min-height:120px;border:2px dashed #aaa;border-radius:12px;background:#fafafa;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer}
    .detail-drop.dragover{border-color:#16875a;background:#e9f7ef}
    .detail-preview{display:block;max-width:100%;height:auto;max-height:none;object-fit:contain;margin:10px auto;border-radius:8px;background:#f7f7f7}

  </style>
</head>

<body>

<div class="wrap">

  <h1>공동구매 관리자</h1>


  <!-- ======================================= -->
  <!-- 랜딩페이지 관리 -->
  <!-- ======================================= -->

  <section class="card">
    <h2>랜딩페이지 내용 변경</h2>
    <div class="row">
      <input type="text" id="title" placeholder="상품명">
      <input type="number" id="price" placeholder="판매가격">
    </div>
    <textarea id="desc" placeholder="상품 상단 설명"></textarea>

    <h2 style="margin-top:26px;">상세페이지 구성</h2>
    <p style="color:#666;line-height:1.6;">
      이미지·글·가격/강조문구를 원하는 순서대로 추가하세요.
      긴 세로 이미지도 원본 비율로 등록할 수 있습니다.
    </p>
    <div class="detail-toolbar">
      <button type="button" class="primary" onclick="addDetailBlock('image')">+ 이미지 추가</button>
      <button type="button" class="secondary" onclick="addDetailBlock('text')">+ 글 추가</button>
      <button type="button" class="secondary" onclick="addDetailBlock('price')">+ 가격/강조문구 추가</button>
    </div>
    <div id="detailBuilder" class="detail-builder"></div>
    <div id="uploadStatus" class="upload-status"></div>

    <input type="hidden" id="imageUrl">

    <div style="margin-top:18px;">
      <button type="button" class="primary" onclick="saveSettings()">전체 내용 저장</button>
    </div>
    <div id="saveMessage" class="save-message">저장되었습니다.</div>
  </section>

  <!-- ======================================= -->
  <!-- 주문 관리 -->
  <!-- ======================================= -->

  <section class="card">

    <div class="order-top">

      <h2 style="margin:0;">
        주문 관리
      </h2>

      <div>

        <span class="order-count">
          총 주문 <span id="orderCount">0</span>건
        </span>

        &nbsp;

        <button
          type="button"
          class="secondary"
          onclick="loadOrders()"
        >
          새로고침
        </button>

      </div>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>접수일</th>
            <th>성함</th>
            <th>연락처</th>
            <th>수량</th>
            <th>주소</th>
            <th>요청사항</th>

            <th>전화확인</th>
            <th>입금확인</th>
            <th>안내완료</th>
            <th>배송완료</th>

            <th>문자 복사</th>

          </tr>

        </thead>

        <tbody id="ordersBody">

          <tr>
            <td colspan="11" class="empty">
              주문내역을 불러오는 중입니다.
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</div>


<script>

/* =====================================================
   Google Apps Script 웹앱 주소
===================================================== */

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbz9-pk6kkPk01Lh11agNKxeV1Gjo_kzAPYOXyJ9kXUVY7r8t3ptrLurCjOwdTf31f00ug/exec';


let selectedFile = null;


/* =====================================================
   페이지 시작
===================================================== */

document.addEventListener('DOMContentLoaded', function () {

  loadSettings();

  loadOrders();

});


/* =====================================================
   상세페이지 블록 편집기
===================================================== */
let detailBlocks = [];
let detailSeq = 0;

function detailId() {
  detailSeq += 1;
  return 'detail_' + Date.now() + '_' + detailSeq;
}

function addDetailBlock(type, value = '', caption = '') {
  detailBlocks.push({ id: detailId(), type, value, caption });
  renderDetailBlocks();
}

function renderDetailBlocks() {
  const root = document.getElementById('detailBuilder');

  if (!detailBlocks.length) {
    root.innerHTML = '<div class="detail-empty">아직 상세 내용이 없습니다.<br>위 버튼으로 이미지나 글을 추가해 주세요.</div>';
    return;
  }

  root.innerHTML = detailBlocks.map(function (block, index) {
    const label = block.type === 'image' ? '이미지' :
                  block.type === 'price' ? '가격 / 강조문구' : '글';

    let editor = '';

    if (block.type === 'text') {
      editor = `<textarea placeholder="설명글을 입력하세요."
        oninput="setDetailValue('${block.id}', this.value)">${escapeHtml(block.value)}</textarea>`;
    }

    if (block.type === 'price') {
      editor = `<input type="text" placeholder="예: 20kg 공동구매 특가 59,900원"
        value="${escapeHtml(block.value)}"
        oninput="setDetailValue('${block.id}', this.value)">`;
    }

    if (block.type === 'image') {
      editor = `
        <div id="drop_${block.id}" class="detail-drop"
          onclick="document.getElementById('file_${block.id}').click()">
          📷<br>${block.value ? '클릭하거나 끌어다 놓아 이미지 교체' : '클릭하거나 이미지를 끌어다 놓으세요'}
        </div>
        <input id="file_${block.id}" type="file"
          accept="image/jpeg,image/png,image/webp" style="display:none"
          onchange="selectDetailImage('${block.id}', this.files[0])">
        ${block.value ? `<img class="detail-preview" src="${escapeHtml(driveDisplayUrl(block.value))}" alt="상세 이미지">` : ''}
        <input type="text" placeholder="이미지 아래 설명 (선택)"
          value="${escapeHtml(block.caption || '')}"
          oninput="setDetailCaption('${block.id}', this.value)">
      `;
    }

    return `
      <div class="detail-block">
        <div class="detail-head">
          <strong>${index + 1}. ${label}</strong>
          <div class="detail-actions">
            <button type="button" class="secondary" onclick="moveDetail(${index}, -1)">↑ 위</button>
            <button type="button" class="secondary" onclick="moveDetail(${index}, 1)">↓ 아래</button>
            <button type="button" class="danger" onclick="removeDetail(${index})">삭제</button>
          </div>
        </div>
        ${editor}
      </div>`;
  }).join('');

  setupDetailDrops();
}

function setDetailValue(id, value) {
  const block = detailBlocks.find(b => b.id === id);
  if (block) block.value = value;
}
function setDetailCaption(id, value) {
  const block = detailBlocks.find(b => b.id === id);
  if (block) block.caption = value;
}
function removeDetail(index) {
  if (confirm('이 블록을 삭제할까요?')) {
    detailBlocks.splice(index, 1);
    renderDetailBlocks();
  }
}
function moveDetail(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= detailBlocks.length) return;
  [detailBlocks[index], detailBlocks[target]] = [detailBlocks[target], detailBlocks[index]];
  renderDetailBlocks();
}

function setupDetailDrops() {
  detailBlocks.filter(b => b.type === 'image').forEach(function (block) {
    const zone = document.getElementById('drop_' + block.id);
    if (!zone) return;
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) selectDetailImage(block.id, file);
    });
  });
}

function selectDetailImage(id, file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    alert('이미지 파일만 선택해 주세요.');
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    alert('8MB 이하 이미지를 사용해 주세요.');
    return;
  }
  uploadDetailImage(id, file);
}

function fileToDataUrl(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadDetailImage(id, file) {
  setUploadStatus('loading', '이미지를 업로드하고 있습니다...');
  try {
    const base64Data = await fileToDataUrl(file);
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'uploadImage',
        fileName: file.name,
        mimeType: file.type,
        base64Data: base64Data
      })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.message || '이미지 업로드 실패');

    const block = detailBlocks.find(b => b.id === id);
    if (block) block.value = result.imageUrl;

    const firstImage = detailBlocks.find(b => b.type === 'image' && b.value);
    document.getElementById('imageUrl').value = firstImage ? firstImage.value : '';

    setUploadStatus('success', '이미지 업로드 완료. 마지막에 "전체 내용 저장"을 눌러 주세요.');
    renderDetailBlocks();
  } catch (error) {
    setUploadStatus('error', '이미지 업로드 오류: ' + error.message);
  }
}

function driveDisplayUrl(url) {
  let imageUrl = String(url || '').trim();
  let fileId = '';
  if (imageUrl.includes('id=')) fileId = imageUrl.split('id=')[1].split('&')[0];
  else if (imageUrl.includes('/file/d/')) fileId = imageUrl.split('/file/d/')[1].split('/')[0];
  if (fileId) return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1600';
  return imageUrl;
}

function setUploadStatus(type, message) {
  const box = document.getElementById('uploadStatus');
  box.className = 'upload-status';
  if (!type) {
    box.style.display = 'none';
    box.textContent = '';
    return;
  }
  box.classList.add(type);
  box.textContent = message;
}

/* =====================================================
   설정 불러오기
===================================================== */
async function loadSettings() {
  try {
    const response = await fetch(SCRIPT_URL + '?action=settings&_=' + Date.now());
    const result = await response.json();
    const data = result.settings || result.data || result || {};

    document.getElementById('title').value = data.title || '';
    document.getElementById('price').value = data.price || '';
    document.getElementById('imageUrl').value = data.image || data.imageUrl || '';
    document.getElementById('desc').value = data.description || data.desc || '';

    let blocks = data.detailBlocks || data.blocks || '';
    if (typeof blocks === 'string' && blocks.trim()) {
      try { blocks = JSON.parse(blocks); } catch (e) { blocks = []; }
    }

    if (Array.isArray(blocks) && blocks.length) {
      detailBlocks = blocks.map(function (b) {
        return {
          id: detailId(),
          type: b.type || 'text',
          value: String(b.value || ''),
          caption: String(b.caption || '')
        };
      });
    } else {
      detailBlocks = [];
      const oldImage = data.image || data.imageUrl || '';
      const oldDesc = data.description || data.desc || '';
      if (oldImage) addDetailBlock('image', oldImage, '');
      if (oldDesc) addDetailBlock('text', oldDesc, '');
    }
    renderDetailBlocks();
  } catch (error) {
    console.error('설정 불러오기 오류:', error);
    renderDetailBlocks();
  }
}

/* =====================================================
   랜딩페이지 설정 저장
===================================================== */
async function saveSettings() {
  const cleanBlocks = detailBlocks.map(function (b) {
    return {
      type: b.type,
      value: String(b.value || '').trim(),
      caption: String(b.caption || '').trim()
    };
  }).filter(b => b.value);

  const firstImage = cleanBlocks.find(b => b.type === 'image');

  const payload = {
    action: 'updateSettings',
    title: document.getElementById('title').value.trim(),
    price: document.getElementById('price').value,
    image: firstImage ? firstImage.value : document.getElementById('imageUrl').value.trim(),
    description: document.getElementById('desc').value.trim(),
    detailBlocks: JSON.stringify(cleanBlocks)
  };

  try {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (result.success === false) throw new Error(result.message || '저장 실패');

    const message = document.getElementById('saveMessage');
    message.style.display = 'block';
    setTimeout(() => message.style.display = 'none', 3000);
  } catch (error) {
    alert('저장 중 오류가 발생했습니다.\\n' + error.message);
  }
}


/* =====================================================
   주문 목록
===================================================== */

async function loadOrders() {

  const body =
    document.getElementById(
      'ordersBody'
    );


  body.innerHTML =
    '<tr><td colspan="11" class="empty">주문내역을 불러오는 중입니다.</td></tr>';


  try {

    const response =
      await fetch(
        SCRIPT_URL +
        '?action=orders'
      );


    const result =
      await response.json();


    const orders =
      Array.isArray(result)
      ? result
      : (
          result.orders ||
          result.data ||
          []
        );


    document
      .getElementById(
        'orderCount'
      )
      .textContent =
      orders.length;


    if (
      orders.length === 0
    ) {

      body.innerHTML =
        '<tr><td colspan="11" class="empty">현재 접수된 주문이 없습니다.</td></tr>';

      return;

    }


    body.innerHTML =
      orders.map(
        function (order) {

          return createOrderRow(
            order
          );

        }
      ).join('');

  }

  catch (error) {

    console.error(error);


    body.innerHTML =
      '<tr><td colspan="11" class="empty">주문내역을 불러오지 못했습니다.</td></tr>';

  }

}


/* =====================================================
   주문 한 줄 만들기
===================================================== */

function createOrderRow(order) {

  const id =
    order.id ||
    order.orderId ||
    order.row ||
    '';


  const name =
    escapeHtml(
      order.name || ''
    );


  const phone =
    escapeHtml(
      order.phone || ''
    );


  const qty =
    escapeHtml(
      order.qty ||
      order.quantity ||
      ''
    );


  const address =
    escapeHtml(
      order.address || ''
    );


  const memo =
    escapeHtml(
      order.memo ||
      order.request ||
      ''
    );


  const date =
    escapeHtml(
      order.created_at ||
      order.createdAt ||
      order.date ||
      ''
    );


  return `

    <tr>

      <td>${date}</td>

      <td>${name}</td>

      <td>${phone}</td>

      <td>${qty}</td>

      <td class="address">
        ${address}
      </td>

      <td class="memo">
        ${memo}
      </td>

      <td>

        ${statusButton(
          id,
          'status_call',
          order.status_call ||
          order.callConfirmed,
          '전화'
        )}

      </td>

      <td>

        ${statusButton(
          id,
          'status_paid',
          order.status_paid ||
          order.paid,
          '입금'
        )}

      </td>

      <td>

        ${statusButton(
          id,
          'status_notice',
          order.status_notice ||
          order.notice,
          '안내'
        )}

      </td>

      <td>

        ${statusButton(
          id,
          'status_shipping',
          order.status_shipping ||
          order.shipping,
          '배송'
        )}

      </td>

      <td>

        <button
          class="copy-btn"
          onclick='copyPaymentMessage(${JSON.stringify(
            order.name || ''
          )})'
        >
          입금확인 문자 복사
        </button>

      </td>

    </tr>

  `;

}


/* =====================================================
   상태 버튼
===================================================== */

function statusButton(
  id,
  key,
  value,
  label
) {

  const active =
    value === true ||
    value === 'TRUE' ||
    value === 1 ||
    value === '1';


  return `

    <button
      class="status-btn ${active ? 'on' : 'off'}"
      onclick='toggleOrderStatus(
        ${JSON.stringify(id)},
        ${JSON.stringify(key)},
        ${active ? 'false' : 'true'}
      )'
    >
      ${active ? '✓ ' : ''}
      ${label}
    </button>

  `;

}


/* =====================================================
   주문 상태 변경
===================================================== */

async function toggleOrderStatus(
  id,
  key,
  value
) {

  try {

    const payload = {

      action:
        'updateOrderStatus',

      id:
        id,

      field:
        key,

      value:
        value

    };


    const response =
      await fetch(
        SCRIPT_URL,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    if (
      result.success === false
    ) {

      throw new Error(
        result.message ||
        '상태 변경 실패'
      );

    }


    loadOrders();

  }

  catch (error) {

    alert(
      '주문 상태 변경 중 오류가 발생했습니다.\n' +
      error.message
    );

  }

}


/* =====================================================
   입금 확인 문자 복사
===================================================== */

async function copyPaymentMessage(
  name
) {

  const customer =
    name || '고객';


  const text =
    customer +
    ' 고객님, 입금 확인되었습니다. 주문해 주셔서 감사합니다.';


  try {

    await navigator
      .clipboard
      .writeText(text);


    alert(
      '입금 확인 문구를 복사했습니다.\n\n' +
      text
    );

  }

  catch (error) {

    prompt(
      '아래 문구를 복사해 주세요.',
      text
    );

  }

}


/* =====================================================
   HTML 문자 안전처리
===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}
